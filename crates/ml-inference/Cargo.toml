[package]
name = "ml-inference"
version = "0.1.0"
edition = "2024"

[dependencies]
ml-proto = { path = "../ml-proto" }
anyhow = "1.0.104"
hf-hub = "1.0"
tokenizers = "0.23"
tract-onnx = "0.23"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tonic = { version = "0.14.8", default-features = false, features = ["codegen", "router", "transport"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }