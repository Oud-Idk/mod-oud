name: deploy

# Push to main only. Checks come from checks.yml, which this calls, so a red
# clippy or a failing test still blocks the image build and the deploy.
#
# The build and deploy jobs live here rather than in checks.yml so that a pull
# request cannot reach the registry. They push `:latest` plus a `:sha-<commit>`
# tag; the deploy pulls the SHA tag so the whole stack stays on one revision.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a deploy in flight. Two pushes to main in quick succession
  # would otherwise interrupt one between `git pull` and `compose up`.
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    # A reusable workflow can only ask for what the caller grants, and checks.yml
    # needs pull-requests: read for its changed-path detection. Scoped to this job
    # so the image pushing jobs keep their narrower token.
    permissions:
      contents: read
      pull-requests: read

  build-backend:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Meta (Backend)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-backend
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

  build-ml:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Meta (ML inference)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-ml
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ml
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ml
          cache-to: type=gha,scope=ml,mode=max

  build-dashboard:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Meta (Dashboard)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-dashboard
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/build-push-action@v7
        with:
          context: ./dashboard
          push: true
          build-args: |
            NEXT_PUBLIC_BACKEND_URL=${{ vars.NEXT_PUBLIC_BACKEND_URL || 'http://localhost:8080' }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            NEXT_PUBLIC_HCAPTCHA_SITE_KEY=${{ vars.NEXT_PUBLIC_HCAPTCHA_SITE_KEY }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,scope=dashboard,mode=max

  deploy:
    needs: [ build-backend, build-ml, build-dashboard ]
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Deploy Containers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          set -e
          cd /opt/mod-oud

          # Pin every image to this commit's SHA tag: `latest` can move under a
          # restart or rollback, which would mix ML and bot revisions. GHCR
          # rejects uppercase paths, so lower the owner/repo here.
          image_prefix="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          export ML_IMAGE="$image_prefix-ml:sha-${{ github.sha }}"
          export BACKEND_IMAGE="$image_prefix-backend:sha-${{ github.sha }}"
          export DASHBOARD_IMAGE="$image_prefix-dashboard:sha-${{ github.sha }}"

          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          git pull --ff-only origin main
          docker compose -f docker-compose.prod.yml pull

          # The cache volume was created while the image ran as root; hand it to
          # the service uid once. Volumes created from now on inherit it.
          cache_volume=$(docker volume ls -q --filter label=com.docker.compose.volume=ml-model-cache | head -n 1)
          if [ -n "$cache_volume" ]; then
            docker run --rm --user root -v "$cache_volume:/cache" --entrypoint chown "$ML_IMAGE" -R 10001:10001 /cache
          fi

          docker compose -f docker-compose.prod.yml up -d --remove-orphans
          docker image prune -f

          docker logout ghcr.io
