name: checks

# Runs directly on pull requests, and is called by deploy.yml for pushes to main
# so the image build stays gated on these passing. Defining them once avoids the
# two copies drifting apart.
#
# No `paths:` filter on `on:`. A job skipped by a condition reports Success, but
# a workflow skipped by a path filter stays Pending and blocks the merge, so the
# filtering happens per job, via `changes`.

on:
  workflow_call:
  pull_request:

concurrency:
  group: checks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.deploy.outputs.rust || steps.filter.outputs.rust }}
      dashboard: ${{ steps.deploy.outputs.dashboard || steps.filter.outputs.dashboard }}
    steps:
      # deploy.yml arrives here on a push, where the filter sees only the last
      # commit and could skip a gate that is about to hold production.
      - name: Treat the deploy path as touching everything
        id: deploy
        if: github.event_name != 'pull_request'
        run: |
          echo "rust=true" >> "$GITHUB_OUTPUT"
          echo "dashboard=true" >> "$GITHUB_OUTPUT"

      - name: Detect changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            rust:
              - 'src/**'
              - 'migrations/**'
              - '.sqlx/**'
              - '.aislop/**'
              - 'scripts/check-logging.sh'
              - 'scripts/log_calls.awk'
              - 'scripts/aislop-gate.py'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rustfmt.toml'
              - '.github/workflows/checks.yml'
            dashboard:
              - 'dashboard/**'
              - '.github/workflows/checks.yml'

  # Also runs the logging convention check, another static read of src/.
  cargo-clippy:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Not gating: pedantic and nursery are `warn` in Cargo.toml, so this exits
      # 0 with warnings. Add `-- -D warnings` once the count is at zero.
      - name: Clippy (lib + tests)
        run: SQLX_OFFLINE=true cargo clippy --all-targets

      - name: Logging convention
        run: scripts/check-logging.sh

  cargo-test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Rust tests
        run: SQLX_OFFLINE=true cargo test --lib

  aislop-rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # Pinned so the gate cannot shift without a PR. `ci` alone exits 0 on
      # warnings, so the script fails on any finding outside the baseline.
      - name: Aislop strict gate
        env:
          AISLOP_NO_TELEMETRY: 1
        run: |
          npx -y aislop@0.18.1 ci --format json > /tmp/aislop.json
          python3 scripts/aislop-gate.py /tmp/aislop.json

  dashboard-lint:
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # Reads the pnpm version pinned in dashboard/package.json's packageManager field
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: dashboard/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Install dashboard dependencies
        working-directory: dashboard
        env:
          SHARP_IGNORE_GLOBAL_LIBVIPS: 1
        run: pnpm install --frozen-lockfile

      - name: Dashboard Lint
        working-directory: dashboard
        run: pnpm run lint

  dashboard-test:
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # Reads the pnpm version pinned in dashboard/package.json's packageManager field
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: dashboard/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Install dashboard dependencies
        working-directory: dashboard
        env:
          SHARP_IGNORE_GLOBAL_LIBVIPS: 1
        run: pnpm install --frozen-lockfile

      - name: Dashboard tests
        working-directory: dashboard
        run: pnpm test

  # Separate from `dashboard-test` because it needs a Postgres service and must
  # never silently fall back to a developer's local database. It rides the
  # dashboard filter, which carries migrations/** because the harness applies
  # ../migrations to throwaway databases.
  dashboard-db-tests:
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      # Reads the pnpm version pinned in dashboard/package.json's packageManager field
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: dashboard/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Install dashboard dependencies
        working-directory: dashboard
        env:
          SHARP_IGNORE_GLOBAL_LIBVIPS: 1
        run: pnpm install --frozen-lockfile

      # The harness applies ../migrations to throwaway databases and refuses to
      # touch anything not named mod_oud_test*, so this URL is all it can reach.
      - name: Dashboard database tests
        working-directory: dashboard
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
        run: pnpm run test:db

  aislop-dashboard:
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # Reads the pnpm version pinned in dashboard/package.json's packageManager field
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: dashboard/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Install dashboard dependencies
        working-directory: dashboard
        env:
          SHARP_IGNORE_GLOBAL_LIBVIPS: 1
        run: pnpm install --frozen-lockfile

      # Pinned so the gate cannot shift without a PR. `ci` exits 1 on the
      # baselined dependency error, so the script below is the real gate:
      # it fails only on findings outside dashboard/.aislop/ci-baseline.json.
      - name: Aislop strict gate
        working-directory: dashboard
        env:
          AISLOP_NO_TELEMETRY: 1
        run: |
          npx -y aislop@0.18.1 ci --format json . > /tmp/aislop-dash.json || true
          python3 ../scripts/aislop-gate-dashboard.py /tmp/aislop-dash.json