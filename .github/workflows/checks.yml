name: checks

# Runs directly on pull requests, and is called by deploy.yml for pushes to main
# so the image build stays gated on these passing. Defining them once avoids the
# two copies drifting apart.

on:
  workflow_call:
  pull_request:

concurrency:
  # Prefixed so it can never collide with a caller's group. A called workflow
  # resolves `github.workflow` to the caller, so `github.workflow-ref` here is
  # the same string deploy.yml already holds while it waits for this job. With
  # the same group and cancel-in-progress false, this workflow queues behind its
  # own caller and the run is torn down with every dependent skipped.
  group: checks-${{ github.event_name }}-${{ github.ref }}
  # Only a direct pull_request run has superseded runs worth dropping. A push
  # arrives via deploy.yml, which must not be cancelled underneath it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Not gating: pedantic and nursery are `warn` in Cargo.toml, so this exits
      # 0 with warnings. Add `-- -D warnings` once the count is at zero.
      - name: Clippy (lib + tests)
        run: SQLX_OFFLINE=true cargo clippy --all-targets

      - name: Rust tests
        run: SQLX_OFFLINE=true cargo test --lib

      - name: Logging convention
        run: scripts/check-logging.sh

      # Reads the pnpm version pinned in dashboard/package.json's packageManager field
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: dashboard/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Install dashboard dependencies
        working-directory: dashboard
        env:
          SHARP_IGNORE_GLOBAL_LIBVIPS: 1
        run: pnpm install --frozen-lockfile

      - name: Dashboard Lint
        working-directory: dashboard
        run: pnpm run lint

      - name: Dashboard tests
        working-directory: dashboard
        run: pnpm test
