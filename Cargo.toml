[package]
name = "mod-oud"
version = "0.1.0"
edition = "2024"

[dependencies]
serenity = "0.12"
tokio = { version = "1.0", features = ["full"] }
poise = "0.6"
dotenvy = "0.15"
sqlx = { version = "0.9.0", features = ["postgres", "chrono", "runtime-tokio", "uuid"] }
duration-str = "0.21.0"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
serde = { version = "1.0.228", features = ["derive"] }
rustrict = "0.7.38"
regex = "1.12.3"
linkify = "0.11.0"
serde_json = "1.0.150"
prost = "0.14.3"
reqwest = { version = "0.13.4", features = ["query"] }
redis = { version = "1.2.2", features = ["tokio-comp", "aio", "connection-manager"] }
rand = "0.10.1"
axum = "0.8"
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.7.0", features = ["cors"] }
unicode-segmentation = "1.10.1"
serde_with = "3.21.0"
futures-util = "0.3.32"
moka = { version = "0.12", features = ["future"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
log = "0.4.30"
uuid = { version = "1.23.3", features = ["v4", "serde"] }
emojis = "0.9.0"
