# Two upload flags, one per test surface. Statuses aggregate both.
flags:
  dashboard:
    paths:
      - dashboard/
  backend:
    paths:
      - src/

coverage:
  status:
    project:
      default:
        informational: true   # Overall repo coverage won't fail CI
    patch:
      default:
        informational: true   # Your PR diff coverage won't fail CI (the one bothering you!)